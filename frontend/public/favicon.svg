<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="kalosRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FF3366" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="1" />
      <stop offset="70%" stop-color="#0088FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Holographic Kalos Ring -->
  <circle cx="50" cy="50" r="46" stroke="url(#kalosRing)" stroke-width="6" fill="#0A0F1D" />

  <!-- Pokeball Top Half (Kalos Crimson) -->
  <path d="M 10 50 A 40 40 0 0 1 90 50 Z" fill="#FF3366" />

  <!-- Pokeball Bottom Half (High-Tech Platinum Silver) -->
  <path d="M 10 50 A 40 40 0 0 0 90 50 Z" fill="#E2E8F0" />

  <!-- Center Division Line -->
  <line x1="10" y1="50" x2="90" y2="50" stroke="#0A0F1D" stroke-width="7" />

  <!-- Center Outer Ring -->
  <circle cx="50" cy="50" r="16" fill="#E2E8F0" stroke="#0A0F1D" stroke-width="6" />

  <!-- Inner Holographic Mega Core (Cyan Neon) -->
  <circle cx="50" cy="50" r="8" fill="#00E5FF" filter="url(#glow)" />

  <!-- Mega Evolution DNA Strand Indicator -->
  <path d="M 47 44 Q 50 50 53 56 M 53 44 Q 50 50 47 56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
</svg>
